<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><script src="/compat.js"></script>
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>米家面板</title><style>
:root{--bg:#0b0e14;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);--txt:#eef2f7;--muted:#8f9aaa;--accent:#ff7a18;--green:#43d17d;--red:#ff5f6d;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;}
body{background:
 radial-gradient(1200px 700px at 88% -10%, rgba(255,105,0,.18), transparent 60%),
 radial-gradient(900px 700px at -10% 110%, rgba(64,120,255,.12), transparent 60%),
 linear-gradient(165deg,#151a26 0%,#0b0e14 60%,#17120c 100%);}
.app{height:100vh;width:100%;max-width:1760px;margin:0 auto;display:flex;flex-direction:column;padding:16px 20px 10px;}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex:none;flex-wrap:wrap;row-gap:10px;margin-bottom:12px;}
.clock{font-size:108px;line-height:1;font-weight:700;letter-spacing:1px;white-space:nowrap;background:linear-gradient(180deg,#fff 25%,#ffc59a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.date{font-size:22px;color:var(--muted);margin-top:8px;white-space:nowrap;}
.brand{display:flex;align-items:center;gap:14px;padding-bottom:4px;flex-wrap:wrap;row-gap:8px;min-width:0;}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:8px;}
.home{font-size:17px;color:#ffcaa3;border:1px solid rgba(255,122,24,.35);background:rgba(255,122,24,.10);padding:8px 14px;border-radius:999px;white-space:nowrap;flex:none;}
.count{font-size:16px;color:var(--muted);white-space:nowrap;}
.nav{display:flex;align-items:center;gap:12px;margin-left:4px;}
.toolbtn{height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font-size:18px;cursor:pointer;white-space:nowrap;flex:none;}
.toolbtn.primary{background:var(--accent);border-color:var(--accent);font-weight:600;}
.arrow{flex:none;width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font-size:28px;line-height:1;cursor:pointer;}
.arrow:disabled{opacity:.22;}
.pageno{font-size:17px;color:var(--muted);min-width:60px;text-align:center;white-space:nowrap;}
.viewport{flex:1;min-height:0;overflow:hidden;position:relative;touch-action:none;}
.track{display:flex;height:100%;transition:transform .35s cubic-bezier(.22,.61,.36,1);}
.page{min-width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:12px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.12);}
.card:before{content:'';position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:4px;background:var(--accent);opacity:.9;}
.card.on{background:linear-gradient(160deg,rgba(255,122,24,.13),rgba(255,255,255,.055));border-color:rgba(255,122,24,.28);}
.card.offline{opacity:.45;}
.card.blind{border-style:dashed;border-color:rgba(255,255,255,.18);}
.card.blind:before{background:#8f9aaa;opacity:.5;}
.card.camera{cursor:pointer;background:linear-gradient(160deg,rgba(64,146,255,.16),rgba(255,255,255,.055));border-color:rgba(64,146,255,.30);}
.card.camera:before{background:#4092ff;opacity:1;}
.card.camera:active{transform:scale(.985);}
.card.camera.offline{opacity:.5;}
.card.camera .camHint{font-size:13px;color:var(--muted);margin-top:5px;}
.card.camera .viewBtn{margin-top:0;flex:1;width:100%;display:flex;align-items:center;justify-content:center;height:64px;border-radius:18px;background:#2f7fe0;color:#fff;font-weight:700;font-size:21px;letter-spacing:.5px;}
.card.camera .viewBtn:after{content:'›';font-size:27px;line-height:1;margin-left:7px;opacity:.85;}
.card.speaker{cursor:pointer;background:linear-gradient(160deg,rgba(139,92,246,.18),rgba(255,255,255,.055));border-color:rgba(139,92,246,.32);}
.card.speaker:before{background:#8b5cf6;opacity:1;}
.card.speaker:active{transform:scale(.985);}
.card.speaker.offline{opacity:.5;}
.card.speaker .spkHint{font-size:13px;color:var(--muted);margin-top:5px;}
.card.speaker .spkBtn{margin-top:0;flex:1;width:100%;display:flex;align-items:center;justify-content:center;height:64px;border-radius:18px;background:#7c3aed;color:#fff;font-weight:700;font-size:21px;letter-spacing:.5px;}
.card.speaker .spkBtn:after{content:'›';font-size:27px;line-height:1;margin-left:7px;opacity:.85;}
.card.sensor{background:linear-gradient(160deg,rgba(67,209,125,.14),rgba(255,255,255,.055));border-color:rgba(67,209,125,.30);}
.card.sensor:before{background:#43d17d;opacity:1;}
.card.sensor .sensorMain{display:flex;align-items:flex-end;gap:18px;margin-top:8px;padding-left:12px;}
.card.sensor .sensorTemp{font-size:54px;line-height:.9;font-weight:750;letter-spacing:-2px;}
.card.sensor .sensorTemp small{font-size:17px;font-weight:650;letter-spacing:0;margin-left:2px;}
.card.sensor .sensorHum{font-size:14px;line-height:1.25;color:var(--muted);padding-bottom:4px;}
.card.sensor .sensorHum b{display:block;font-size:24px;color:var(--txt);}
.card.sensor .sensorBat{font-size:13px;color:var(--muted);margin-left:auto;padding-bottom:5px;}
.card.sensor .sensorExtras{font-size:13px;color:var(--muted);margin-top:6px;padding-left:12px;display:flex;flex-wrap:wrap;gap:4px 14px;}
.card.sensor .sensorExtras b{color:var(--txt);font-weight:650;}
.card.sensor .sensorList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:8px;padding-left:12px;}
.card.sensor .sensorRow{font-size:13px;color:var(--muted);}
.card.sensor .sensorRow b{display:block;font-size:22px;line-height:1.15;color:var(--txt);font-weight:700;}
.card.sensor .sensorHint{font-size:13px;color:var(--muted);margin-top:8px;padding-left:12px;}
.badge.sensor{background:rgba(67,209,125,.12);color:#43d17d;}
.capsTools{display:flex;gap:6px;align-items:flex-start;flex-shrink:0;}
.capsBtn{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--muted);border-radius:9px;font-size:12px;line-height:1;padding:7px 8px;cursor:pointer;white-space:nowrap;}
.capsBtn:hover{color:var(--txt);border-color:var(--accent);}
.capsBody{flex:1;overflow:auto;padding:12px 20px 20px;display:grid;gap:4px;}
.capsSection{font-size:13px;color:var(--muted);margin:8px 0 2px;font-weight:700;letter-spacing:.5px;}
.capRow{display:grid;grid-template-columns:minmax(96px,.9fr) minmax(150px,1.4fr);gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
.capRow .cl{font-size:15px;line-height:1.3;}
.capRow .cl small{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
.capRow select,.capRow input[type=number]{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt);font:inherit;font-size:15px;padding:8px 9px;}
.capRange{display:flex;align-items:center;gap:8px;}
.capRange input[type=range]{flex:1;accent-color:var(--accent);min-width:0;}
.capVal{min-width:48px;text-align:right;color:var(--txt);font-size:14px;font-variant-numeric:tabular-nums;}
.capToggle{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--muted);font-weight:700;font-size:14px;padding:9px 12px;cursor:pointer;}
.capToggle.on{background:rgba(67,209,125,.16);border-color:rgba(67,209,125,.45);color:#43d17d;}
.capActions{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;}
.capAction{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt);font-weight:650;font-size:14px;padding:9px 13px;cursor:pointer;}
.capEmpty{font-size:14px;color:var(--muted);padding:18px 0;line-height:1.6;}
.assistant{position:fixed;inset:0;z-index:80;background:rgba(8,12,22,.62);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:22px;}
.assistantSheet{width:min(760px,100%);max-height:min(86vh,780px);background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;}
.assistantHead{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);}
.assistantHead .who{flex:1;min-width:0;}
.assistantHead .who b{font-size:22px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.assistantHead .who span{font-size:13px;color:var(--muted);}
.assistantClose{border:none;background:rgba(255,255,255,.08);color:#e2e8f0;border-radius:12px;width:48px;height:48px;font-size:24px;cursor:pointer;}
.assistantLog{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;min-height:160px;}
.aMsg{max-width:88%;padding:11px 14px;border-radius:14px;font-size:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
.aMsg.user{align-self:flex-end;background:#e8f0ff;color:#17325b;border-bottom-right-radius:4px;}
.aMsg.ai{align-self:flex-start;background:#f2edff;color:#2d1b59;border-bottom-left-radius:4px;}
.aMsg.sys{align-self:center;background:transparent;color:var(--muted);font-size:13px;text-align:center;padding:4px 8px;}
.aMsg.err{align-self:center;background:#fdecea;color:#b42318;font-size:14px;}
.assistantFoot{padding:14px 20px 18px;border-top:1px solid var(--line);background:rgba(255,255,255,.04);}
.assistantInput{display:flex;gap:10px;align-items:flex-end;}
.assistantInput textarea{flex:1;min-height:48px;max-height:150px;resize:none;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;background:var(--card);color:var(--txt);}
.assistantSend{border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:0 18px;height:48px;cursor:pointer;white-space:nowrap;}
.assistantSend:disabled{opacity:.5;}
.assistantTools{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.assistantTools button{border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--txt);font-weight:650;font-size:14px;padding:10px 13px;cursor:pointer;}
.assistantTools button.listening{background:#fff1f2;color:#be123c;border-color:#fecdd3;}
.assistantHint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px;}
.hidden{display:none!important;}
body.assistantOpen{overflow:hidden;}
.card.busy{opacity:.65;}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-left:12px;}
.nm{font-size:27px;font-weight:650;line-height:1.15;display:flex;align-items:center;gap:9px;}
.ico{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--accent-soft,rgba(128,128,128,.12));border:1px solid var(--line);font-size:20px;line-height:1;}
.ico:empty{display:none;}
.md{font-size:14px;color:#7f8a9a;margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.status{font-size:16px;color:var(--muted);margin-top:4px;}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:#68707d;}
.dot.on{background:var(--green);box-shadow:0 0 10px rgba(67,209,125,.7);}
.dot.off{background:var(--red);}
.badge{font-size:13px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#b9c2cf;white-space:nowrap;}
.badge.blind{background:rgba(255,95,109,.12);color:#ff9aa3;}
.blindHint{font-size:14px;line-height:1.55;color:var(--muted);margin-top:12px;padding-left:12px;}
.metrics{font-size:18px;color:#aeb8c6;line-height:1.5;padding-left:12px;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 16px;}
.metrics span{white-space:nowrap;}
.metrics b{font-weight:650;color:#e9eef5;}
.widget{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.04));}
.widget:before{background:#4db2ff;}
.widget.cal:before{background:#a78bfa;}
.widget.energy:before{background:#43d17d;}
.wmain{display:flex;align-items:flex-end;justify-content:space-between;padding-left:12px;margin-top:8px;}
.wtemp{font-size:72px;font-weight:700;line-height:1;}
.wtemp small{font-size:20px;font-weight:500;color:var(--muted);margin-left:2px;}
.wdesc{font-size:22px;color:#dbe3ee;margin-bottom:6px;}
.wmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:16px;color:#aeb8c6;padding-left:12px;margin-top:8px;}
.forecast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-left:12px;margin-top:auto;padding-top:8px;}
.fcDay{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;}
.fcDate{font-size:13px;color:var(--muted);}
.fcIcon{font-size:15px;margin:3px 0;color:#dbe3ee;}
.fcTmp{font-size:14px;color:#e9eef5;}
.calHead{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13px;color:var(--muted);padding-left:12px;margin-top:8px;}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding-left:12px;margin-top:4px;flex:1;}
.calDay{display:flex;align-items:center;justify-content:center;font-size:17px;color:#c9d2de;border-radius:8px;min-height:26px;}
.calDay.blank{visibility:hidden;}
.calDay.today{background:var(--accent);color:#fff;font-weight:700;}
.emain{padding-left:12px;margin-top:10px;display:flex;align-items:flex-end;gap:10px;}
.ewatt{font-size:68px;font-weight:700;line-height:1;}
.ewatt small{font-size:18px;color:var(--muted);font-weight:500;margin-left:2px;}
.edesc{font-size:16px;color:var(--muted);margin-bottom:6px;}
.ebar{height:10px;border-radius:5px;background:rgba(255,255,255,.08);margin:12px 0 0 12px;overflow:hidden;}
.ebar span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#43d17d,#ffd166);}
.emeta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:16px;color:#aeb8c6;padding-left:12px;margin-top:10px;}
.editView{width:100%;height:100%;overflow:auto;padding-right:2px;}
.editGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-content:start;}
.editCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-height:92px;display:flex;align-items:center;gap:12px;cursor:grab;user-select:none;touch-action:none;transition:.15s;}
.editCard.dragging{opacity:.4;}
.editHandle{font-size:20px;color:var(--muted);letter-spacing:-3px;padding-right:2px;}
.editBody{flex:1;min-width:0;}
.editBody .nm{font-size:21px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.editBody .md{font-size:14px;color:#7f8a9a;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pageBreak{grid-column:1/-1;border-top:1px dashed rgba(255,255,255,.25);padding:10px 0 0;color:var(--muted);font-size:14px;margin:2px 0;}
.editHint{color:var(--muted);font-size:14px;padding:14px 2px 4px;}
body.editing .dots{display:none;}
body.editing .viewport{touch-action:pan-y;}
.acrow{display:flex;align-items:center;gap:12px;margin-top:6px;padding-left:12px;}
.temp{font-size:52px;font-weight:700;line-height:1;min-width:116px;}
.temp small{font-size:18px;font-weight:500;color:var(--muted);margin-left:2px;}
.step{width:50px;height:50px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:25px;font-weight:600;}
.step:disabled{opacity:.3;}
.modeWrap{padding-left:12px;margin-top:6px;}
.mode{width:100%;padding:9px 10px;border-radius:14px;border:1px solid var(--line);background:#1d2430;color:#fff;font-size:18px;}
.mode:disabled{opacity:.3;}
.actions{display:flex;gap:10px;margin-top:auto;padding:10px 0 0 12px;border-top:1px solid var(--line);}
.btn{flex:1;border:1px solid transparent;border-radius:18px;min-height:64px;padding:0 12px;font-size:23px;font-weight:700;letter-spacing:.5px;color:#fff;background:#303847;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .08s ease,filter .08s ease,background .15s ease;}
.btn:before{content:'';width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.65;flex:0 0 auto;}
.btn.on{background:linear-gradient(135deg,#ff9a3d,#ff6900);box-shadow:0 8px 20px rgba(255,105,0,.25);}
.btn.on:before{opacity:1;box-shadow:0 0 10px rgba(255,255,255,.65);}
.btn:disabled{opacity:.3;}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);}
.btn.small{min-height:56px;font-size:21px;padding:0 8px;border-radius:16px;}
.btn.small:before{display:none;}
.card.ac .btn{min-height:48px;font-size:19px;border-radius:14px;}
.card.ac .actions{padding-top:6px;}
.card.ac .ico{width:30px;height:30px;border-radius:8px;font-size:18px;}
.card.ac .nm{font-size:25px;}
.card.ac .md{font-size:13px;margin-top:1px;}
.card.ac .status{font-size:14px;margin-top:2px;}
.card.ac .acrow{gap:8px;margin-top:2px;}
.card.ac .temp{font-size:42px;min-width:88px;}
.card.ac .temp small{font-size:16px;}
.card.ac .step{width:44px;height:44px;border-radius:12px;font-size:22px;}
.card.ac .modeWrap{margin-top:4px;}
.card.ac .mode{padding:6px 10px;font-size:16px;border-radius:10px;}
.empty{grid-column:1/-1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:18px;gap:8px;}
.foot{flex:none;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#6f7988;padding-top:8px;}
.dots{display:flex;gap:8px;}
.dotp{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18);cursor:pointer;}
.dotp.on{background:var(--accent);}
.msg{position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-20px);background:#2f6f4f;color:#fff;padding:12px 20px;border-radius:12px;font-size:18px;opacity:0;pointer-events:none;transition:.2s;z-index:20;}
.msg.show{opacity:1;transform:translateX(-50%) translateY(0);}
.msg.err{background:#8a2f2f;}
.btn,.sw,.step,.toolbtn,.arrow{transition:transform .08s ease,filter .08s ease,background .15s ease,color .15s ease;}
.btn:active,.sw:active,.step:active,.toolbtn:active,.arrow:active{transform:scale(.94);filter:brightness(.9);}
body{user-select:none;-webkit-user-select:none;overscroll-behavior:none;}
body.nocursor,body.nocursor *{cursor:none!important;}
body.showcursor,body.showcursor *{cursor:auto!important;}
*::-webkit-scrollbar{width:0;height:0;}
@media (pointer:coarse){*,*::before,*::after{cursor:none!important;}}
body.touch *{cursor:none!important;}
@media (min-width:1501px){.card.span2{grid-column:span 2;}}
body.light{
  --bg:#eef2f7;--card:#ffffff;--line:rgba(15,23,42,.10);--txt:#172033;--muted:#5b6678;
  --accent-soft:rgba(255,106,0,.08);--accent-line:rgba(255,106,0,.24);
  background:
    radial-gradient(1200px 700px at 88% -10%, rgba(255,122,24,.10), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(64,120,255,.08), transparent 60%),
    linear-gradient(165deg,#f7f9fc 0%,#eef2f7 60%,#fdf6ef 100%);
  color:var(--txt);
}
body.light .clock{background:linear-gradient(180deg,#162033 25%,#e2610d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
body.light .home{color:#c2410c;border-color:rgba(255,106,0,.25);background:rgba(255,106,0,.08);}
body.light .toolbtn,body.light .arrow{background:#fff;border-color:var(--line);color:#172033;}
body.light .toolbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
body.light .card{background:#fff;border-color:var(--line);box-shadow:0 8px 24px rgba(15,23,42,.07);}
body.light .card.on{background:linear-gradient(160deg,#fff3e6,#fff);border-color:rgba(255,106,0,.30);}
body.light .widget{background:linear-gradient(160deg,#fff,#f8fafc);}
body.light .card.blind{border-color:#cbd5e1;}
body.light .card.camera{background:linear-gradient(160deg,#eaf4ff,#fff);border-color:rgba(47,127,224,.28);}

body.theme-morandi{
  --bg:#f1ece4;--card:rgba(255,252,247,.84);--line:rgba(120,105,90,.14);--txt:#3f3a35;--muted:#8b8176;
  --accent:#7d9b83;--accent-2:#c08a7d;--accent-soft:rgba(125,155,131,.14);--accent-line:rgba(125,155,131,.30);
  --on-accent:#ffffff;--green:#7d9b83;--red:#b56a63;
  font-family:Georgia,'Songti SC','Noto Serif CJK SC','Microsoft YaHei',serif;
  background:
    radial-gradient(900px 700px at 10% -10%,rgba(192,138,125,.16),transparent 60%),
    radial-gradient(800px 700px at 95% 10%,rgba(125,155,131,.18),transparent 55%),
    radial-gradient(700px 600px at 50% 112%,rgba(180,160,130,.14),transparent 60%),
    repeating-linear-gradient(0deg,rgba(120,105,90,.022) 0 1px,transparent 1px 4px),
    #f1ece4;
}
body.theme-morandi .clock{font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;font-weight:600;letter-spacing:2px;background:none;color:#4a443d;-webkit-text-fill-color:#4a443d;}
body.theme-morandi .date{color:#8b8176;letter-spacing:1px;}
body.theme-morandi .nm,body.theme-morandi .assistantHead .who b{font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;font-weight:600;letter-spacing:.5px;}
body.theme-morandi .home{color:#6f8f76;border-color:rgba(125,155,131,.24);background:rgba(125,155,131,.12);border-radius:14px 6px 14px 6px;}
body.theme-morandi .toolbtn{background:rgba(255,252,247,.82);border-color:rgba(120,105,90,.16);color:#4a443d;border-radius:14px 6px 14px 6px;box-shadow:none;}
body.theme-morandi .toolbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
body.theme-morandi .arrow{border-radius:50% 50% 50% 12px;background:rgba(255,252,247,.82);border-color:rgba(120,105,90,.16);color:#4a443d;}
body.theme-morandi .card{border-radius:26px 10px 26px 10px;background:rgba(255,252,247,.84);border-color:rgba(120,105,90,.14);padding:16px 18px;box-shadow:0 8px 24px rgba(107,93,79,.07),inset 0 0 0 1px rgba(255,255,255,.50);}
body.theme-morandi .card:before{top:24px;bottom:24px;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent-2));opacity:.8;}
body.theme-morandi .card.on{background:linear-gradient(150deg,rgba(125,155,131,.16),rgba(255,252,247,.90));border-color:rgba(125,155,131,.30);}
body.theme-morandi .card.camera{background:linear-gradient(150deg,rgba(150,170,190,.16),rgba(255,252,247,.90));border-color:rgba(120,145,170,.25);}
body.theme-morandi .card.speaker{background:linear-gradient(150deg,rgba(192,138,125,.16),rgba(255,252,247,.90));border-color:rgba(192,138,125,.25);}
body.theme-morandi .widget{background:linear-gradient(155deg,rgba(255,253,249,.96),rgba(248,242,233,.82));}
body.theme-morandi .card.camera .viewBtn{background:#8a9db0;border-radius:14px 6px 14px 6px;}
body.theme-morandi .card.speaker .spkBtn{background:#a9848f;border-radius:14px 6px 14px 6px;}
body.theme-morandi .badge{background:rgba(125,155,131,.12);color:#6f8f76;border-radius:10px 4px 10px 4px;}
body.theme-morandi .badge.blind{background:rgba(181,106,99,.12);color:#a05a52;}
body.theme-morandi .calDay{border-radius:10px 4px 10px 4px;}
body.theme-morandi .calDay.today{background:var(--accent);color:#fff;}
body.theme-morandi .fcDay{background:rgba(255,252,247,.80);border-color:rgba(120,105,90,.12);border-radius:12px 5px 12px 5px;}
body.theme-morandi .ebar{background:rgba(120,105,90,.12);}
body.theme-morandi .ebar span{background:linear-gradient(90deg,#8fae94,#c9a27f);}
body.theme-morandi .btn{border-radius:18px 8px 18px 8px;background:rgba(180,170,155,.22);color:#4a443d;box-shadow:none;}
body.theme-morandi .btn.on{background:linear-gradient(135deg,#8fae94,#6f8f76);color:#fff;box-shadow:0 8px 18px rgba(111,143,118,.22);}
body.theme-morandi .btn.ghost{background:rgba(255,252,247,.70);border-color:rgba(120,105,90,.16);}
body.theme-morandi .step{border-radius:14px 6px 14px 6px;background:rgba(255,252,247,.85);border-color:rgba(120,105,90,.16);color:#4a443d;}
body.theme-morandi .mode{border-radius:14px 6px 14px 6px;background:#faf5ee;border-color:rgba(120,105,90,.16);color:#4a443d;}
body.theme-morandi .editCard{background:rgba(255,252,247,.88);border-color:rgba(120,105,90,.14);border-radius:20px 8px 20px 8px;}
body.theme-morandi .msg{background:#7d9b83;border-radius:14px 6px 14px 6px;}
body.theme-morandi .msg.err{background:#b56a63;}
body.theme-morandi .assistantSheet{background:#fdf9f3;border-radius:28px 12px 28px 12px;}
body.theme-morandi .assistantHead{border-color:rgba(120,105,90,.12);}
body.theme-morandi .assistantFoot{background:#f7f1e8;border-color:rgba(120,105,90,.12);}
body.theme-morandi .assistantClose{background:rgba(180,170,155,.20);color:#4a443d;border-radius:14px 6px 14px 6px;}
body.theme-morandi .assistantSend{background:var(--accent);border-radius:14px 6px 14px 6px;}
body.theme-morandi .assistantInput textarea{border-radius:14px 6px 14px 6px;background:#faf5ee;border-color:rgba(120,105,90,.16);color:#3f3a35;}
body.theme-morandi .assistantTools button{border-radius:12px 5px 12px 5px;background:#fdf9f3;border-color:rgba(120,105,90,.16);color:#4a443d;}
body.theme-morandi .aMsg.user{background:#e3ece4;color:#3f4a41;border-radius:16px 16px 4px 16px;}
body.theme-morandi .aMsg.ai{background:#f2e4df;color:#4a3b37;border-radius:16px 16px 16px 4px;}
body.theme-morandi .aMsg.err{background:#f7e2df;color:#a05a52;}

/* —— 像素终端：黑绿 CRT、扫描线、硬阴影、方角控件、光标闪烁 —— */
body.theme-pixel{
  --bg:#050805;--card:#071007;--line:#1f7a1f;--txt:#b7ffb7;--muted:#5f9e5f;
  --accent:#39ff14;--accent-2:#ffb000;--accent-soft:rgba(57,255,20,.10);--accent-line:rgba(57,255,20,.45);
  --on-accent:#031003;--green:#39ff14;--red:#ff4d4d;
  font-family:'Courier New',Consolas,'Microsoft YaHei',monospace;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),
    radial-gradient(900px 600px at 85% -10%,rgba(57,255,20,.10),transparent 60%),
    #050805;
}
body.theme-pixel .clock{font-family:'VT323','Courier New',monospace;font-weight:400;letter-spacing:4px;background:none;color:var(--accent);-webkit-text-fill-color:var(--accent);text-shadow:4px 4px 0 rgba(57,255,20,.16);}
body.theme-pixel .clock:after{content:'█';margin-left:6px;animation:themeBlink 1s steps(1,end) infinite;}
body.theme-pixel .date{color:#7fce7f;letter-spacing:1px;}
body.theme-pixel .home{border-radius:0;border:2px solid #1f7a1f;color:var(--accent);background:#071007;box-shadow:3px 3px 0 #0a260a;}
body.theme-pixel .toolbtn{border-radius:0;background:#071007;border:2px solid #1f7a1f;color:var(--accent);box-shadow:3px 3px 0 #0a260a;letter-spacing:1px;}
body.theme-pixel .toolbtn.primary{background:var(--accent);border-color:var(--accent);color:#031003;}
body.theme-pixel .arrow{border-radius:0;border:2px solid #1f7a1f;background:#071007;color:var(--accent);box-shadow:3px 3px 0 #0a260a;}
body.theme-pixel .page{gap:12px;}
body.theme-pixel .card{border-radius:0;background:#071007;border:2px solid #1f7a1f;padding:13px 15px;box-shadow:4px 4px 0 #0b2b0b;}
body.theme-pixel .card:before{left:auto;right:0;top:0;bottom:auto;width:100%;height:3px;border-radius:0;background:repeating-linear-gradient(90deg,var(--accent) 0 5px,transparent 5px 9px);opacity:.55;}
body.theme-pixel .card.on{background:#0a1a0a;border-color:var(--accent);box-shadow:4px 4px 0 #123f12,0 0 18px rgba(57,255,20,.18);}
body.theme-pixel .card.camera{background:#06120a;border-color:#2f9e44;box-shadow:4px 4px 0 #0b2f14;}
body.theme-pixel .card.speaker{background:#120a14;border-color:#b06cff;box-shadow:4px 4px 0 #2a1038;}
body.theme-pixel .card.speaker:before{background:repeating-linear-gradient(90deg,#d8b4fe 0 5px,transparent 5px 9px);}
body.theme-pixel .widget{background:#061006;}
body.theme-pixel .card.camera .viewBtn,body.theme-pixel .card.speaker .spkBtn{border-radius:0;border:2px solid var(--accent);background:#071007;color:var(--accent);}
body.theme-pixel .card.speaker .spkBtn{border-color:#b06cff;color:#d8b4fe;}
body.theme-pixel .badge{border-radius:0;background:#0a1a0a;border:1px solid #1f7a1f;color:var(--accent);}
body.theme-pixel .badge.blind{border-color:#7a1f1f;color:#ff7b7b;background:#160808;}
body.theme-pixel .dot{border-radius:0;}
body.theme-pixel .calDay{border-radius:0;}
body.theme-pixel .calDay.today{background:var(--accent);color:#031003;font-weight:700;}
body.theme-pixel .fcDay{border-radius:0;background:#0a1a0a;border-color:#1f7a1f;}
body.theme-pixel .ebar{border-radius:0;background:#0a1a0a;border:1px solid #1f7a1f;}
body.theme-pixel .ebar span{border-radius:0;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 9px);}
body.theme-pixel .btn{border-radius:0;background:#0a1a0a;border:2px solid #1f7a1f;color:var(--accent);box-shadow:3px 3px 0 #0a260a;}
body.theme-pixel .btn.on{background:var(--accent);border-color:var(--accent);color:#031003;box-shadow:3px 3px 0 #0f3d0f;}
body.theme-pixel .btn.ghost{background:#071007;}
body.theme-pixel .step{border-radius:0;background:#0a1a0a;border:2px solid #1f7a1f;color:var(--accent);}
body.theme-pixel .mode{border-radius:0;background:#0a1a0a;border:2px solid #1f7a1f;color:var(--accent);}
body.theme-pixel .editCard{border-radius:0;background:#071007;border:2px solid #1f7a1f;box-shadow:3px 3px 0 #0b2b0b;}
body.theme-pixel .foot{color:#4f8a4f;}
body.theme-pixel .dotp{border-radius:0;background:rgba(57,255,20,.20);}
body.theme-pixel .dotp.on{background:var(--accent);box-shadow:0 0 10px rgba(57,255,20,.55);}
body.theme-pixel .msg{border-radius:0;background:#071007;border:2px solid var(--accent);color:var(--accent);box-shadow:4px 4px 0 #0a260a;font-family:monospace;}
body.theme-pixel .msg.err{border-color:var(--red);color:#ff7b7b;box-shadow:4px 4px 0 #2a0a0a;}
body.theme-pixel .assistant{background:rgba(0,0,0,.72);}
body.theme-pixel .assistantSheet{border-radius:0;background:#050c05;border:2px solid #1f7a1f;box-shadow:8px 8px 0 #0a260a;}
body.theme-pixel .assistantHead{border-color:#1f7a1f;}
body.theme-pixel .assistantFoot{background:#071007;border-color:#1f7a1f;}
body.theme-pixel .assistantClose{border-radius:0;background:#0a1a0a;border:2px solid #1f7a1f;color:var(--accent);}
body.theme-pixel .assistantSend{border-radius:0;background:var(--accent);color:#031003;border:2px solid var(--accent);}
body.theme-pixel .assistantInput textarea{border-radius:0;background:#0a1a0a;border:2px solid #1f7a1f;color:var(--txt);font-family:monospace;}
body.theme-pixel .assistantTools button{border-radius:0;background:#0a1a0a;border:2px solid #1f7a1f;color:var(--accent);}
body.theme-pixel .aMsg{border-radius:0;font-family:monospace;}
body.theme-pixel .aMsg.user{background:#0a1a0a;color:var(--accent);border:1px solid #1f7a1f;}
body.theme-pixel .aMsg.ai{background:#071007;color:#b7ffb7;border:1px solid #1f7a1f;}
body.theme-pixel .aMsg.err{background:#160808;color:#ff7b7b;border:1px solid #7a1f1f;}

/* 侧边色条被替换/隐藏后，回收内容缩进，保证左右对齐 */
body.theme-apple .ctop,body.theme-apple .metrics,body.theme-apple .wmain,body.theme-apple .wmeta,body.theme-apple .forecast,body.theme-apple .calHead,body.theme-apple .calGrid,body.theme-apple .emain,body.theme-apple .emeta,body.theme-apple .acrow,body.theme-apple .modeWrap,body.theme-apple .actions,body.theme-apple .blindHint,
body.theme-flyme .ctop,body.theme-flyme .metrics,body.theme-flyme .wmain,body.theme-flyme .wmeta,body.theme-flyme .forecast,body.theme-flyme .calHead,body.theme-flyme .calGrid,body.theme-flyme .emain,body.theme-flyme .emeta,body.theme-flyme .acrow,body.theme-flyme .modeWrap,body.theme-flyme .actions,body.theme-flyme .blindHint,
body.theme-cyber .ctop,body.theme-cyber .metrics,body.theme-cyber .wmain,body.theme-cyber .wmeta,body.theme-cyber .forecast,body.theme-cyber .calHead,body.theme-cyber .calGrid,body.theme-cyber .emain,body.theme-cyber .emeta,body.theme-cyber .acrow,body.theme-cyber .modeWrap,body.theme-cyber .actions,body.theme-cyber .blindHint,
body.theme-pixel .ctop,body.theme-pixel .metrics,body.theme-pixel .wmain,body.theme-pixel .wmeta,body.theme-pixel .forecast,body.theme-pixel .calHead,body.theme-pixel .calGrid,body.theme-pixel .emain,body.theme-pixel .emeta,body.theme-pixel .acrow,body.theme-pixel .modeWrap,body.theme-pixel .actions,body.theme-pixel .blindHint{padding-left:0;}
body.theme-apple .ebar,body.theme-flyme .ebar,body.theme-cyber .ebar,body.theme-pixel .ebar{margin-left:0;}

@media (max-width:1500px){
  .app{height:100vh;padding-bottom:12px;}
  .viewport{overflow-x:hidden;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .track{height:auto;align-items:flex-start;padding-bottom:18px;}
  .page{height:auto;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,minmax(240px,1fr));}
  .editGrid{grid-template-columns:repeat(4,1fr);}
  .card{min-height:240px;}
}
@media (max-width:1100px){
  .page{grid-template-columns:repeat(3,1fr);}
  .editGrid{grid-template-columns:repeat(3,1fr);}
  .clock{font-size:48px;}
}
@media (max-width:760px){
  .app{padding:14px;}
  .head{flex-wrap:wrap;align-items:flex-start;}
  .brand{flex-wrap:wrap;padding-bottom:0;}
  .clock{font-size:42px;}
  .page{grid-template-columns:repeat(2,1fr);grid-template-rows:auto;}
  .editGrid{grid-template-columns:repeat(2,1fr);}
  .card{min-height:230px;padding:16px;}
  .wtemp{font-size:44px;}
  .ewatt{font-size:42px;}
  .assistant{padding:0;align-items:flex-end;}
  .assistantSheet{width:100%;max-height:92vh;border-radius:20px 20px 0 0;}
  .assistantHead{padding:14px 16px;}
  .assistantHead .who b{font-size:20px;}
  .assistantLog{padding:12px 14px;min-height:120px;}
  .aMsg{font-size:15px;max-width:94%;}
  .assistantFoot{padding:12px 14px 16px;}
  .assistantInput textarea{font-size:16px;min-height:44px;}
  .assistantSend{height:44px;padding:0 14px;font-size:15px;}
}
/* 7 寸 4x3：天气卡信息密度高，单独压缩内部排版，避免底部预报被裁切 */

  .card.widget.weather{padding:14px 16px;}
  .card.widget.weather .wmain{margin-top:4px;}
  .card.widget.weather .wtemp{font-size:66px;}
  .card.widget.weather .wtemp small{font-size:18px;}
  .card.widget.weather .wdesc{font-size:21px;margin-bottom:2px;}
  .card.widget.weather .wmeta{font-size:15px;gap:4px 14px;margin-top:6px;}
  .card.widget.weather .forecast{padding-top:6px;gap:6px;}
  .card.widget.weather .fcDay{padding:4px 3px;border-radius:10px;}
  .card.widget.weather .fcDate{font-size:12px;}
  .card.widget.weather .fcIcon{font-size:14px;margin:2px 0;}
  .card.widget.weather .fcTmp{font-size:13px;}
}

function widgetDefs(){
  return [
    {type:'weather',_key:'widget:weather',name:weatherLabel,md:'天气组件',icon:'天'},
    {type:'calendar',_key:'widget:calendar',name:'日历',md:'日历组件',icon:'日'},
    {type:'energy',_key:'widget:energy',name:'家庭用电',md:'用电汇总',icon:'电'}
  ];
}
function orderedCards(list){
  list.forEach(function(d){if(!d._key)d._key=(d.type==='camera'?'cam:':'dev:')+d.did;});
  var cameras=list.filter(function(d){return d.type==='camera';});
  var speakers=list.filter(function(d){return d.type==='speaker';});
  var sensors=list.filter(function(d){return d.role==='sensor';});
  var supported=list.filter(function(d){return d.type!=='camera'&&d.type!=='speaker'&&!d.blind;});
  var blind=list.filter(function(d){return d.type!=='camera'&&d.type!=='speaker'&&d.blind;});
  var widgets=widgetDefs();
  var byKey={};
  supported.concat(widgets).concat(speakers).concat(cameras).concat(blind).forEach(function(d){byKey[d._key]=d;});
  var defaultOrder=widgets.concat(sensors).concat(speakers).concat(cameras).concat(supported).concat(blind).map(function(d){return d._key;});
  var order=(layoutOrder&&layoutOrder.length)?layoutOrder.slice():[];
  var missingSensors=sensors.filter(function(d){return order.indexOf(d._key)<0;}).map(function(d){return d._key;});
  var missingNew=speakers.concat(cameras).filter(function(d){return order.indexOf(d._key)<0;}).map(function(d){return d._key;});
  if(order.length&&missingSensors.length){
    var ins=0,first=-1,last=-1;
    for(var si=0;si<order.length;si++){
      if(order[si].indexOf('widget:')===0){if(first<0)first=si;last=si;}
      else if(first>=0)break;
    }
    if(first>=0)ins=last+1;
    order=order.slice(0,ins).concat(missingSensors,order.slice(ins));
  }
  if(order.length&&missingNew.length){
    var ins=-1;
    for(var i=0;i<order.length;i++){if(order[i].indexOf('widget:')===0)ins=i;}
    order=order.slice(0,ins+1).concat(missingNew,order.slice(ins+1));
  }
  var cards=[],seen={};
  order.forEach(function(k){var d=byKey[k];if(d&&!seen[k]){cards.push(d);seen[k]=true;}});
  defaultOrder.forEach(function(k){if(!seen[k]&&byKey[k]){cards.push(byKey[k]);seen[k]=true;}});
  return cards;
}
function buildPages(list){
  var cards=orderedCards(list);
  var out=[];
  for(var i=0;i<cards.length;i+=PAGE)out.push(cards.slice(i,i+PAGE));
  if(!out.length)out.push([]);
  return out;
}

function renderEdit(){
  var cards=orderedCards(allCards());

  var seen={};
  editOrder=editOrder.filter(function(k){if(!byKey[k]||seen[k])return false;seen[k]=true;return true;});
  cards.forEach(function(d){if(editOrder.indexOf(d._key)<0)editOrder.push(d._key);});
  var html='';
  for(var i=0;i<editOrder.length;i++){
    if(i>0&&i%PAGE===0){
      html+='<div class="pageBreak">第 '+(i/PAGE)+' 页结束 · 下一张开始第 '+(i/PAGE+1)+' 页</div>';
    }
    var d=byKey[editOrder[i]];
    if(d)html+=editCardHTML(d);
  }
  track.style.transition='none';
  track.style.transform='translateX(0)';
  track.innerHTML='<div class="editView"><div class="editGrid" id="editGrid">'+html+'</div><div class="editHint">拖动卡片调整顺序，每 '+PAGE+' 张为一页；保存后生效。</div></div>';
  bindEditDrag();

function bindEditDrag(){
  var grid=document.getElementById('editGrid');
  if(!grid)return;
  var dragEl=null,dragId=null,sx=0,sy=0,dragging=false;
  function onMove(e){
    if(dragEl===null||e.pointerId!==dragId)return;
    if(!dragging&&Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)<8)return;
    if(!dragging){
      dragging=true;dragEl.classList.add('dragging');dragEl.style.pointerEvents='none';
    }
    var el=document.elementFromPoint(e.clientX,e.clientY);
    var card=el?el.closest('.editCard'):null;
    if(card&&card!==dragEl){
      var r=card.getBoundingClientRect();
      grid.insertBefore(dragEl,e.clientY>r.top+r.height/2?card.nextSibling:card);
    }
    e.preventDefault();
  }
  function onUp(e){
    if(e.pointerId!==dragId)return;
    document.removeEventListener('pointermove',onMove);
    document.removeEventListener('pointerup',onUp);
    document.removeEventListener('pointercancel',onUp);
    if(dragEl){dragEl.classList.remove('dragging');dragEl.style.pointerEvents='';}
    if(dragging){
      editOrder=Array.from(grid.querySelectorAll('.editCard')).map(function(x){return x.dataset.key;});
      renderEdit();
    }
    dragEl=null;dragId=null;dragging=false;
  }
  Array.prototype.forEach.call(grid.querySelectorAll('.editCard'),function(el){
    el.addEventListener('pointerdown',function(e){
      if(e.button!==undefined&&e.button!==0)return;
      dragEl=el;dragId=e.pointerId;sx=e.clientX;sy=e.clientY;dragging=false;
      document.addEventListener('pointermove',onMove,{passive:false});
      document.addEventListener('pointerup',onUp);
      document.addEventListener('pointercancel',onUp);
      e.preventDefault();
    });
  });
}
function toggleEdit(){
  if(editing)return;

function saveLayout(){
  fetch(API+'/api/layout',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({order:editOrder})}).then(function(r){return r.json();}).then(function(r){
    if(!r.ok){toast(r.msg||'保存失败',true);return;}
    layoutOrder=r.order||editOrder.slice();
    editing=false;document.body.classList.remove('editing');page=0;
    lastRenderKey='';render();toast('排版已保存');
  }).catch(function(e){toast('保存失败：'+e,true);});

function render(){
  if(editing){renderEdit();return;}
  var scrollY=viewport.scrollTop||0;
  pages=buildPages(allCards());
  if(page>=pages.length)page=pages.length-1;
  if(page<0)page=0;
  var html=pages.map(function(p){
    return '<div class="page">'+(p.length?p.map(function(d,i){return cardHTML(d,i>=8&&p.length===10);}).join(''):'<div class="empty"><div>暂无设备</div><div style="font-size:13px">正在等待云端数据</div></div>')+'</div>';
  }).join('');
  updateNav();
  updateHeader();
  if(html===lastRenderKey)return;   // 15 秒轮询时数据没变就不重建 DOM，避免闪烁和丢状态
  lastRenderKey=html;
  track.innerHTML=html;
  requestAnimationFrame(function(){
    move(false);
    if(viewport.scrollTop!==scrollY)viewport.scrollTop=scrollY;
  });
}
function go(delta){

function load(){
  if(editing)return;

    document.getElementById('home').textContent=s.home_label||'';
    statusData=s;updateCount();

    applyTheme(s.theme||theme);
    applyCursor(s.hide_cursor);
    if(location.pathname==='/'&&s.active_page&&s.active_page.id){location.href='/';return null;}
    if(!s.logged_in){location.href=API+'/login';return null;}
    return fetch(API+'/api/devices').then(function(r){return r.json();});
  }).then(function(j){
    if(!j)return;
    devices=j.devices||[];
    if(j.layout)layoutOrder=j.layout;
    render();
    if(j.ts){var d=new Date(j.ts*1000);document.getElementById('updated').textContent='更新 '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
  }).catch(function(e){

function toggle(did,on,btn){
  if(btn.disabled)return;
  var card=btn.closest('.card');var old=btn.textContent;
  var nm=card.querySelector('.nm').textContent||'';
  if(on&&nm.indexOf('总闸')>=0&&!confirm('确定要关闭电源总闸？'))return;
  card.classList.add('busy');btn.disabled=true;btn.textContent='···';
  fetch(API+'/api/control',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({did:did,cmd:'power',value:!on})}).then(function(r){return r.json();}).then(function(r){
    card.classList.remove('busy');btn.disabled=false;
    if(r.ok){
      var now=!on;btn.textContent=now?'关闭':'开启';btn.classList.toggle('on',now);
      var st=card.querySelector('.status');if(st)st.innerHTML=now?'<span class="dot on"></span>已开启':'<span class="dot"></span>已关闭';
      toast(now?'已开启':'已关闭');setTimeout(load,900);
    }else{btn.textContent=old;toast(r.msg||'控制失败',true);}
  }).catch(function(e){card.classList.remove('busy');btn.disabled=false;btn.textContent=old;toast('请求失败：'+e,true);});
}
function control(did,cmd,value,el){
  var old=el?el.disabled:false;if(el)el.disabled=true;
  fetch(API+'/api/control',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({did:did,cmd:cmd,value:value})}).then(function(r){return r.json();}).then(function(r){
    if(el)el.disabled=old;
    if(r.ok){toast('已发送');setTimeout(load,700);}
    else toast(r.msg||'控制失败',true);
  }).catch(function(e){if(el)el.disabled=old;toast('请求失败：'+e,true);});
}
function blind(did,on,btn){
  var card=btn.closest('.card');var btns=card.querySelectorAll('button');
  btns.forEach(function(b){b.disabled=true;});
  fetch(API+'/api/control',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({did:did,cmd:'power',value:on})}).then(function(r){return r.json();}).then(function(r){
    btns.forEach(function(b){b.disabled=false;});
    if(r.ok)toast('已发送（状态未知）');

      aget('capsName').textContent=(d&&d.name)||'更多控制';
      aget('capsStatus').textContent=(d&&d.error)||'读取失败';
      aget('capsBody').innerHTML='<div class="capEmpty">'+esc((d&&d.error)||'该设备没有可用的通用控制')+'</div>';
      return;
    }
    capsData=d;
    aget('capsName').textContent=d.name||'更多控制';
    aget('capsStatus').textContent=(d.online?'在线':'离线')+' · '+esc(d.model||'')+' · 通用 MIoT 控制';
    renderCaps();
  }).catch(function(e){
    aget('capsStatus').textContent='读取失败';
    aget('capsBody').innerHTML='<div class="capEmpty">读取失败：'+esc(e)+'</div>';
  });
}
function capRangeLabel(el,unit){
  var v=el.parentNode.querySelector('.capVal');
  if(v)v.textContent=el.value+(unit||'');
}
function renderCaps(){
  if(!capsData)return;
  var props=capsData.props||[],actions=capsData.actions||[];
  var html='';
  if(props.length){
    html+='<div class="capsSection">可写属性</div>';
    html+=props.map(function(p){
      var label='<div class="cl">'+esc(p.label||p.token)+'<small>'+esc(p.token)+'</small></div>';
      var ctl='';
      if(p.kind==='bool'){
        var on=!!p.value;
        ctl='<button class="capToggle'+(on?' on':'')+'" onclick="capSet('+p.siid+','+p.piid+','+(on?'false':'true')+',this)">'+(on?'已开启':'已关闭')+'</button>';
      }else if(p.kind==='enum'){
        var opts=(p.options||[]).map(function(o){return '<option value="'+esc(o.value)+'"'+(String(o.value)===String(p.value)?' selected':'')+'>'+esc(o.label)+'</option>';}).join('');
        ctl='<select onchange="capSet('+p.siid+','+p.piid+',this.value,this)">'+opts+'</select>';
      }else if(p.kind==='range'){
        var r=p.range||[0,100,1],lo=Number(r[0]),hi=Number(r[1]),step=Number(r[2])||1;
        var val=(p.value===null||p.value===undefined)?lo:p.value;
        ctl='<div class="capRange"><input type="range" min="'+lo+'" max="'+hi+'" step="'+step+'" value="'+val+'" oninput="capRangeLabel(this,\''+esc(p.unit||'')+'\')" onchange="capSet('+p.siid+','+p.piid+',this.value,this)"><span class="capVal">'+esc(val)+(esc(p.unit||''))+'</span></div>';
      }else if(p.kind==='number'){
        ctl='<input type="number" value="'+(p.value===null||p.value===undefined?'':esc(p.value))+'" onchange="capSet('+p.siid+','+p.piid+',this.value,this)">';
      }
      if(!ctl)return '';
      return '<div class="capRow">'+label+ctl+'</div>';
    }).join('');
  }
  if(actions.length){
    html+='<div class="capsSection">设备动作</div><div class="capActions">';
    html+=actions.map(function(a){return '<button class="capAction" onclick="capAction('+a.siid+','+a.aiid+',this)">'+esc(a.label||a.token)+'</button>';}).join('');
    html+='</div>';
  }
  if(!html)html='<div class="capEmpty">该设备没有可用的通用属性或动作。</div>';
  aget('capsBody').innerHTML=html;
}
function capSet(siid,piid,value,el){
  if(!capsDid)return;
  var prop=(capsData&&capsData.props?capsData.props:[]).filter(function(p){return p.siid===siid&&p.piid===piid;})[0];
  if(prop&&prop.token==='on'&&/总闸|门闸|门锁|电闸/.test((capsData&&capsData.name)||'')&&!confirm('这是总闸/门锁类设备，确定切换电源吗？'))return;
  if(el)el.disabled=true;
  fetch(API+'/api/set_prop',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({did:capsDid,siid:siid,piid:piid,value:value})}).then(function(r){return r.json();}).then(function(d){
    if(el)el.disabled=false;
    if(d&&d.ok){toast('已写入');setTimeout(loadCaps,450);}
    else toast((d&&d.msg)||'写入失败',true);
  }).catch(function(e){if(el)el.disabled=false;toast('请求失败：'+e,true);});
}
function capAction(siid,aiid,el){
  if(!capsDid)return;
  if(/总闸|门闸|门锁|电闸/.test((capsData&&capsData.name)||'')&&!confirm('这是总闸/门锁类设备，确定执行该动作吗？'))return;
  if(el)el.disabled=true;
  fetch(API+'/api/action',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({did:capsDid,siid:siid,aiid:aiid})}).then(function(r){return r.json();}).then(function(d){
    if(el)el.disabled=false;
    if(d&&d.ok){toast('已执行');setTimeout(loadCaps,500);}
    else toast((d&&d.msg)||'执行失败',true);
  }).catch(function(e){if(el)el.disabled=false;toast('请求失败：'+e,true);});
}
function stopSpeakerChat(){
  if(assistantChatTimer){clearTimeout(assistantChatTimer);assistantChatTimer=null;}
  var b=aget('aSend');if(b)b.disabled=false;
}
function sendSpeakerText(){
  if(!assistantSpeaker)return;
  var t=aget('aText'),btn=aget('aSend');
  var text=(t.value||'').trim();
  if(!text)return;
  var max=Number(speakerCfg.max_chars)||200;
  if(text.length>max){toast('问题最多 '+max+' 字',true);return;}
  assistantMsg(text,'user');t.value='';
  btn.disabled=true;assistantLastAnswer='';
  var pending=assistantMsg(speakerCfg.answer_mode==='text'?'正在生成回答…':'已提交，音箱正在回答…','sys');
  fetch(API+'/api/speaker/chat',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({speaker_id:assistantSpeaker.id,text:text})}).then(function(r){return r.json();}).then(function(d){
    if(!assistantSpeaker)return;
    if(!d||!d.ok){
      if(pending)pending.className='aMsg err';
      if(pending)pending.textContent=(d&&d.error)||'提交失败';
      btn.disabled=false;return;
    }
    assistantTaskId=d.task_id||'';
    pollSpeakerChat(d.task_id||'',pending,0);
  }).catch(function(e){
    if(!assistantSpeaker)return;
    if(pending){pending.className='aMsg err';pending.textContent='提交失败：'+e;}
    btn.disabled=false;
  });
}
function pollSpeakerChat(taskId,pending,n){
  if(!assistantSpeaker)return;
  if(n>45){if(pending){pending.className='aMsg err';pending.textContent='等待回答超时';}stopSpeakerChat();return;}
  assistantChatTimer=setTimeout(function(){
    var sid=assistantSpeaker&&assistantSpeaker.id;if(!sid)return;
    fetch(API+'/api/speaker/chat_status?speaker_id='+encodeURIComponent(sid)).then(function(r){return r.json();}).then(function(d){
      if(!assistantSpeaker)return;
      if(!d||!d.ok){
        if(pending){pending.className='aMsg err';pending.textContent=(d&&d.error)||'读取状态失败';}
        stopSpeakerChat();return;
      }
      if(taskId&&d.task_id&&d.task_id!==taskId){pollSpeakerChat(taskId,pending,n+1);return;}
      if(d.answer&&d.answer!==assistantLastAnswer){
        assistantLastAnswer=d.answer;assistantMsg(d.answer,'ai');
      }
      if(pending){
        if(d.phase==='failed'||d.phase==='cancelled'){pending.className='aMsg err';pending.textContent=d.error||'回答失败';}
        else if(d.phase==='speaking')pending.textContent='音箱正在播报…';
        else pending.textContent='正在生成回答…';
      }
      if(d.phase==='completed'||d.phase==='failed'||d.phase==='cancelled'){
        if(pending&&d.phase==='completed')pending.textContent='回答完成';
        stopSpeakerChat();return;
      }
      pollSpeakerChat(taskId,pending,n+1);
    }).catch(function(e){
      if(!assistantSpeaker)return;
      if(pending){pending.className='aMsg err';pending.textContent='读取状态失败：'+e;}
      stopSpeakerChat();
    });
  },1200);
}
function toggleSpeakerVoice(){
  if(assistantVoiceTimer)stopSpeakerVoice();
  else startSpeakerVoice();
}
function startSpeakerVoice(){
  if(!assistantSpeaker)return;
  if(speakerCfg.voice_enabled===false){toast('语音提问已在后台关闭',true);return;}
  var sid=assistantSpeaker.id,btn=aget('aVoice');
  btn.disabled=true;btn.textContent='准备聆听…';
  fetch(API+'/api/speaker/listen?speaker_id='+encodeURIComponent(sid)+'&since=0').then(function(r){return r.json();}).then(function(d){
    btn.disabled=false;
    if(!assistantSpeaker)return;
    if(!d||!d.ok){btn.textContent='语音提问';assistantMsg((d&&d.error)||'无法开始语音提问','err');return;}
    assistantVoiceSince=Number(d.since)||0;assistantVoiceHeard=false;
    assistantVoiceBaseline=((d.chat||{}).answer)||'';voiceLastAnswer=assistantVoiceBaseline;
    assistantVoiceStarted=Date.now();
    btn.textContent='停止聆听';btn.classList.add('listening');
    assistantMsg('请现在对“'+assistantSpeaker.name+'”说：小爱同学，请问……','sys');
    assistantMsg('正在聆听（约 90 秒）…','sys');
    assistantVoiceTimer=setInterval(pollSpeakerVoice,1500);
  }).catch(function(e){btn.disabled=false;btn.textContent='语音提问';assistantMsg('无法开始语音提问：'+e,'err');});
}
function pollSpeakerVoice(){
  if(!assistantSpeaker||!assistantVoiceTimer)return;
  if(Date.now()-assistantVoiceStarted>90000){stopSpeakerVoice();assistantMsg('聆听超时，请重新点“语音提问”','err');return;}
  var sid=assistantSpeaker.id;
  fetch(API+'/api/speaker/listen?speaker_id='+encodeURIComponent(sid)+'&since='+assistantVoiceSince).then(function(r){return r.json();}).then(function(d){
    if(!assistantSpeaker)return;
    if(!d||!d.ok){stopSpeakerVoice(true);assistantMsg((d&&d.error)||'聆听失败','err');return;}
    assistantVoiceSince=Number(d.since)||assistantVoiceSince;
    if(d.message&&d.message.query&&!assistantVoiceHeard){
      assistantVoiceHeard=true;assistantMsg(d.message.query,'user');
      assistantMsg(speakerCfg.answer_mode==='text'?'已听到，等待面板回答…':'已听到，AI 正在回答…','sys');
    }
    var chat=d.chat||{};
    if(chat.answer&&chat.answer!==voiceLastAnswer){
      voiceLastAnswer=chat.answer;assistantMsg(chat.answer,'ai');
    }
    if(assistantVoiceHeard&&(chat.phase==='completed'||chat.phase==='failed'||chat.phase==='cancelled')){
      stopSpeakerVoice(true);
      assistantMsg(chat.phase==='completed'?'语音提问完成':'语音回答失败'+(chat.error?('：'+chat.error):''),chat.phase==='completed'?'sys':'err');
    }
  }).catch(function(e){stopSpeakerVoice(true);assistantMsg('聆听失败：'+e,'err');});
}
function stopSpeakerVoice(quiet){
  if(assistantVoiceTimer){clearInterval(assistantVoiceTimer);assistantVoiceTimer=null;}
  var b=aget('aVoice');
  if(b){b.textContent='语音提问';b.classList.remove('listening');b.disabled=false;}
  if(!quiet&&assistantSpeaker)assistantMsg('已停止聆听','sys');
}
var sx=0,sy=0;
viewport.addEventListener('touchstart',function(e){
  if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;
},{passive:true});
viewport.addEventListener('touchend',function(e){
  if(!e.changedTouches.length)return;
  var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.2)go(dx<0?1:-1);
},{passive:true});
var mx=null;
viewport.addEventListener('mousedown',function(e){
  if(e.target.closest('button,select'))return;mx=e.clientX;
});
viewport.addEventListener('mouseup',function(e){
  if(mx===null)return;var dx=e.clientX-mx;mx=null;
  if(Math.abs(dx)>60)go(dx<0?1:-1);
});
window.addEventListener('resize',function(){move(false);});
load();loadCameras();loadSpeakers();setInterval(load,15000);setInterval(loadCameras,300000);setInterval(loadSpeakers,60000);
</script></body></html>
