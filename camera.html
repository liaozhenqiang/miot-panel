<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><script src="/compat.js"></script>
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>摄像头</title>
<style>
:root{--bg:#0a0d13;--panel:#121722;--panel2:#181f2c;--line:rgba(255,255,255,.09);--text:#eef2f7;--muted:#8f9aaa;--accent:#ff6a00;--ok:#3ddc97;--bad:#ff5d5d;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent;}
body{display:flex;flex-direction:column;}
.bar{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);}
.left{display:flex;align-items:baseline;gap:14px;min-width:0;}
.title{font-size:24px;font-weight:700;white-space:nowrap;}
.hint{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
a.btn,button.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);text-decoration:none;font-size:17px;font-weight:600;padding:11px 18px;border-radius:12px;cursor:pointer;min-height:44px;}
a.btn:active,button.btn:active{transform:scale(.96);background:rgba(255,255,255,.12);}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
button.btn[disabled]{opacity:.45;pointer-events:none;}
.main{flex:1;display:flex;min-height:0;}
.side{width:330px;flex:0 0 330px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
.sideHead{padding:18px 18px 10px;}
.sideTitle{font-size:18px;font-weight:700;}
.sideSub{font-size:13px;color:var(--muted);margin-top:5px;}
.camList{flex:1;overflow:auto;padding:6px 12px 96px;scrollbar-width:thin;}
.cam{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin:6px 0;border:1px solid transparent;border-radius:14px;background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;min-height:76px;}
.cam:active{transform:scale(.985);}
.cam.active{background:rgba(255,106,0,.15);border-color:rgba(255,106,0,.6);}
.cam.off{opacity:.55;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:0 0 10px;box-shadow:0 0 0 3px rgba(255,93,93,.14);}
.cam.on .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,151,.14);}
.camBody{min-width:0;flex:1;}
.camName{font-size:17px;font-weight:650;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.camMeta{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.camState{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cam.active .camState{color:#ffb27a;}
.stage{position:relative;flex:1;min-width:0;background:#000;overflow:hidden;}
iframe{display:block;width:100%;height:100%;border:0;background:#000;}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(4,6,10,.82);z-index:5;}
.loading[hidden]{display:none;}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.16);border-top-color:var(--accent);animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loadText{font-size:17px;color:#dbe3ee;max-width:80%;text-align:center;line-height:1.6;}
.errBox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(4,6,10,.82);padding:28px;z-index:8;}
.errBox[hidden]{display:none;}
.errText{font-size:19px;line-height:1.65;color:#ffd7d7;text-align:center;max-width:760px;}
.errSub{font-size:14px;color:var(--muted);text-align:center;line-height:1.6;}
.hintBar{position:absolute;left:16px;bottom:14px;font-size:12px;color:rgba(255,255,255,.62);background:rgba(0,0,0,.4);padding:7px 12px;border-radius:9px;pointer-events:none;z-index:4;}
.homeFloat{position:fixed;right:20px;bottom:86px;z-index:20;display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-size:18px;font-weight:700;padding:13px 20px;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.18);}
.homeFloat:active{transform:scale(.95);}
@media (max-width:900px){
  .side{width:260px;flex-basis:260px;}
  .title{font-size:20px;}
  .hint{font-size:12px;}
  a.btn,button.btn{font-size:15px;padding:9px 13px;}
  .homeFloat{font-size:16px;padding:11px 16px;right:12px;bottom:74px;}
}
@media (max-width:680px) and (orientation:portrait){
  body{overflow:auto;}
  .main{flex-direction:column;}
  .side{width:100%;flex:0 0 auto;max-height:36vh;border-right:0;border-bottom:1px solid var(--line);}
  .sideHead{padding:12px 14px 4px;}
  .camList{display:flex;gap:8px;overflow-x:auto;padding:4px 10px 10px;}
  .cam{flex:0 0 230px;margin:4px 0;}
  .stage{flex:1;min-height:52vh;}
  .bar{height:auto;flex-basis:auto;padding:10px 12px;flex-wrap:wrap;}
  .left{flex-wrap:wrap;gap:6px;}
  .errText{font-size:16px;}
}
/* —— 跟随面板主题：摄像头页同步配色与结构 —— */
body.light{--bg:#eef2f7;--panel:#ffffff;--panel2:#f8fafc;--line:rgba(15,23,42,.10);--text:#172033;--muted:#5b6678;--accent:#ff6a00;--ok:#2f9e63;--bad:#d93025;background:linear-gradient(165deg,#f7f9fc,#eef2f7 60%,#fdf6ef);}
body.light .bar{background:#fff;border-bottom-color:var(--line);}
body.light .side{background:#fff;border-right-color:var(--line);}
body.light .cam{background:#f8fafc;border-color:#eef1f5;}
body.light .cam.active{background:#fff3e6;border-color:rgba(255,106,0,.35);}
body.light .cam.active .camState{color:#c2410c;}
body.light a.btn,body.light button.btn{background:#fff;border-color:#e2e8f0;color:#172033;}
body.light a.btn:active,body.light button.btn:active{background:#f1f5f9;}
body.light button.btn.primary{background:#ff6a00;border-color:#ff6a00;color:#fff;}
body.light .loading,body.light .errBox{background:rgba(247,249,252,.92);}
body.light .loadText{color:#172033;}
body.light .errText{color:#b42318;}
body.light .errSub{color:#5b6678;}

body.theme-apple{
  --bg:#eef1f6;--panel:rgba(255,255,255,.74);--panel2:rgba(255,255,255,.64);--line:rgba(15,23,42,.08);
  --text:#1d1d1f;--muted:#6e6e73;--accent:#0071e3;--ok:#34c759;--bad:#ff3b30;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;
  background:radial-gradient(900px 600px at 10% -10%,rgba(255,214,102,.34),transparent 60%),radial-gradient(900px 700px at 90% 0%,rgba(94,92,230,.20),transparent 56%),radial-gradient(820px 700px at 50% 112%,rgba(100,210,255,.22),transparent 60%),linear-gradient(160deg,#f8f9fc,#eef1f6 55%,#e9edf5);
}
body.theme-apple .bar{background:rgba(255,255,255,.74);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.92);}
body.theme-apple .title{font-weight:600;letter-spacing:-.4px;}
body.theme-apple .main{padding:16px;gap:16px;}
body.theme-apple .side{background:rgba(255,255,255,.64);border:1px solid rgba(255,255,255,.92);border-radius:28px;overflow:hidden;box-shadow:0 14px 38px rgba(31,41,55,.10);}
body.theme-apple .cam{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);border-radius:20px;box-shadow:0 6px 16px rgba(31,41,55,.06);}
body.theme-apple .cam.active{background:rgba(0,113,227,.12);border-color:rgba(0,113,227,.24);}
body.theme-apple .cam.active .camState{color:#0071e3;}
body.theme-apple .stage{border:1px solid rgba(255,255,255,.92);border-radius:28px;box-shadow:0 18px 44px rgba(31,41,55,.12);}
body.theme-apple a.btn,body.theme-apple button.btn{background:rgba(255,255,255,.74);border-color:rgba(255,255,255,.95);color:#1d1d1f;border-radius:999px;box-shadow:0 6px 16px rgba(31,41,55,.08);}
body.theme-apple button.btn.primary{background:#0071e3;border-color:#0071e3;color:#fff;}
body.theme-apple .homeFloat{background:#0071e3;border-radius:999px;box-shadow:0 10px 26px rgba(0,113,227,.28);}
body.theme-apple .loading,body.theme-apple .errBox{background:rgba(248,250,252,.92);}
body.theme-apple .loadText{color:#1d1d1f;}
body.theme-apple .errText{color:#b42318;}
body.theme-apple .errSub{color:#6e6e73;}

body.theme-flyme{
  --bg:#f4f6f9;--panel:#ffffff;--panel2:#f7f9fc;--line:#e8ecf2;--text:#17181a;--muted:#8a9099;
  --accent:#0084ff;--ok:#32c46b;--bad:#ff4d4f;background:#f4f6f9;
  font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;
}
body.theme-flyme .bar{background:#fff;border-bottom:1px solid #e8ecf2;}
body.theme-flyme .title{font-weight:600;}
body.theme-flyme .main{padding:12px;gap:12px;}
body.theme-flyme .side{background:#fff;border:1px solid #e8ecf2;border-radius:14px;overflow:hidden;}
body.theme-flyme .cam{background:#f7f9fc;border:1px solid transparent;border-radius:10px;box-shadow:none;}
body.theme-flyme .cam.active{background:#eaf4ff;border-color:rgba(0,132,255,.24);}
body.theme-flyme .cam.active .camState{color:#0084ff;}
body.theme-flyme .stage{border:1px solid #e8ecf2;border-radius:14px;}
body.theme-flyme a.btn,body.theme-flyme button.btn{background:#fff;border-color:#e8ecf2;color:#17181a;border-radius:10px;box-shadow:none;}
body.theme-flyme button.btn.primary{background:#0084ff;border-color:#0084ff;color:#fff;}
body.theme-flyme .homeFloat{background:#0084ff;border-radius:10px;box-shadow:0 8px 20px rgba(0,132,255,.22);}
body.theme-flyme .loading,body.theme-flyme .errBox{background:rgba(247,249,252,.94);}
body.theme-flyme .loadText{color:#17181a;}
body.theme-flyme .errText{color:#d4380d;}
body.theme-flyme .errSub{color:#8a9099;}

body.theme-cyber{
  --bg:#02060b;--panel:rgba(3,12,20,.94);--panel2:rgba(0,240,255,.05);--line:rgba(0,240,255,.22);
  --text:#d8fbff;--muted:#5c8f99;--accent:#00f0ff;--ok:#39ff88;--bad:#ff3d6e;
  font-family:Consolas,'Courier New','Microsoft YaHei',monospace;
  background:linear-gradient(rgba(0,240,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.045) 1px,transparent 1px),radial-gradient(900px 600px at 85% -10%,rgba(255,43,214,.16),transparent 60%),#02060b;
  background-size:44px 44px,44px 44px,auto,auto;
}
body.theme-cyber .bar{background:rgba(2,8,14,.94);border-bottom:1px solid var(--line);}
body.theme-cyber .title{letter-spacing:2px;color:#eaffff;text-shadow:0 0 14px rgba(0,240,255,.45);}
body.theme-cyber .main{padding:12px;gap:12px;}
body.theme-cyber .side{background:rgba(3,12,20,.88);border:1px solid var(--line);}
body.theme-cyber .cam{background:linear-gradient(90deg,rgba(0,240,255,.06),rgba(3,12,20,.9));border:1px solid rgba(0,240,255,.16);border-radius:0;}
body.theme-cyber .cam.active{background:rgba(0,240,255,.12);border-color:var(--accent);box-shadow:0 0 16px rgba(0,240,255,.18);}
body.theme-cyber .cam.active .camState{color:var(--accent);}
body.theme-cyber .stage{border:1px solid var(--line);box-shadow:0 0 22px rgba(0,240,255,.10);}
body.theme-cyber .stage:after{content:'';position:absolute;inset:10px;z-index:3;pointer-events:none;border:1px solid rgba(0,240,255,.12);}
body.theme-cyber a.btn,body.theme-cyber button.btn{background:rgba(0,240,255,.06);border:1px solid rgba(0,240,255,.35);color:#c9feff;border-radius:0;letter-spacing:1px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);}
body.theme-cyber button.btn.primary{background:var(--accent);border-color:var(--accent);color:#001014;box-shadow:0 0 18px rgba(0,240,255,.28);}
body.theme-cyber .homeFloat{background:#001014;color:var(--accent);border:1px solid var(--accent);border-radius:0;box-shadow:0 0 18px rgba(0,240,255,.28);}
body.theme-cyber .loading,body.theme-cyber .errBox{background:rgba(0,4,8,.92);}
body.theme-cyber .hintBar{background:rgba(0,8,12,.72);border:1px solid rgba(0,240,255,.16);border-radius:0;color:rgba(200,255,255,.75);font-family:monospace;}

body.theme-morandi{
  --bg:#f1ece4;--panel:rgba(255,252,247,.92);--panel2:rgba(255,252,247,.80);--line:rgba(120,105,90,.14);
  --text:#3f3a35;--muted:#8b8176;--accent:#7d9b83;--ok:#7d9b83;--bad:#b56a63;
  font-family:Georgia,'Songti SC','Noto Serif CJK SC','Microsoft YaHei',serif;
  background:radial-gradient(900px 700px at 10% -10%,rgba(192,138,125,.16),transparent 60%),radial-gradient(800px 700px at 95% 10%,rgba(125,155,131,.18),transparent 55%),repeating-linear-gradient(0deg,rgba(120,105,90,.022) 0 1px,transparent 1px 4px),#f1ece4;
}
body.theme-morandi .bar{background:rgba(255,252,247,.88);border-bottom:1px solid var(--line);}
body.theme-morandi .title{font-family:Georgia,'Songti SC','Noto Serif CJK SC',serif;letter-spacing:.5px;}
body.theme-morandi .main{padding:14px;gap:14px;}
body.theme-morandi .side{background:rgba(255,252,247,.88);border:1px solid var(--line);border-radius:26px 10px 26px 10px;overflow:hidden;box-shadow:0 8px 24px rgba(107,93,79,.07);}
body.theme-morandi .cam{background:rgba(255,252,247,.90);border:1px solid var(--line);border-radius:16px 6px 16px 6px;}
body.theme-morandi .cam.active{background:rgba(125,155,131,.16);border-color:rgba(125,155,131,.32);}
body.theme-morandi .cam.active .camState{color:#6f8f76;}
body.theme-morandi .stage{border:1px solid var(--line);border-radius:26px 10px 26px 10px;box-shadow:0 8px 24px rgba(107,93,79,.08);}
body.theme-morandi a.btn,body.theme-morandi button.btn{background:rgba(255,252,247,.86);border-color:var(--line);color:#4a443d;border-radius:14px 6px 14px 6px;}
body.theme-morandi button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
body.theme-morandi .homeFloat{background:var(--accent);border-radius:14px 6px 14px 6px;box-shadow:0 8px 20px rgba(111,143,118,.22);}
body.theme-morandi .loading,body.theme-morandi .errBox{background:rgba(247,242,234,.94);}
body.theme-morandi .loadText{color:#4a443d;}
body.theme-morandi .errText{color:#a05a52;}
body.theme-morandi .errSub{color:#8b8176;}

body.theme-pixel{
  --bg:#050805;--panel:#050c05;--panel2:#071007;--line:#1f7a1f;--text:#b7ffb7;--muted:#5f9e5f;
  --accent:#39ff14;--ok:#39ff14;--bad:#ff4d4d;
  font-family:'Courier New',Consolas,'Microsoft YaHei',monospace;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(900px 600px at 85% -10%,rgba(57,255,20,.10),transparent 60%),#050805;
}
body.theme-pixel .bar{background:#050c05;border-bottom:2px solid #1f7a1f;}
body.theme-pixel .title{letter-spacing:2px;color:var(--accent);text-shadow:3px 3px 0 rgba(57,255,20,.16);}
body.theme-pixel .main{padding:12px;gap:12px;}
body.theme-pixel .side{background:#050c05;border:2px solid #1f7a1f;border-right:2px solid #1f7a1f;}
body.theme-pixel .cam{background:#071007;border:2px solid #1f7a1f;border-radius:0;box-shadow:4px 4px 0 #0a260a;}
body.theme-pixel .cam.active{background:#0a1a0a;border-color:var(--accent);box-shadow:4px 4px 0 #123f12;}
body.theme-pixel .cam.active .camState{color:var(--accent);}
body.theme-pixel .dot{border-radius:0;box-shadow:none;}
body.theme-pixel .cam.on .dot{box-shadow:none;}
body.theme-pixel .stage{border:2px solid #1f7a1f;box-shadow:6px 6px 0 #0a260a;}
body.theme-pixel a.btn,body.theme-pixel button.btn{background:#071007;border:2px solid #1f7a1f;color:var(--accent);border-radius:0;box-shadow:3px 3px 0 #0a260a;letter-spacing:1px;}
body.theme-pixel button.btn.primary{background:var(--accent);border-color:var(--accent);color:#031003;}
body.theme-pixel .homeFloat{background:var(--accent);border:2px solid var(--accent);color:#031003;border-radius:0;box-shadow:5px 5px 0 #0f3d0f;}
body.theme-pixel .loading,body.theme-pixel .errBox{background:rgba(0,8,0,.92);}
body.theme-pixel .hintBar{border:1px solid #1f7a1f;border-radius:0;background:rgba(5,8,5,.82);color:#7fce7f;font-family:monospace;}

.compBar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 18px;background:rgba(255,106,0,.12);border-bottom:1px solid rgba(255,106,0,.28);font-size:14px;line-height:1.5;}
.compBar.hidden{display:none;}
.compBar .grow{flex:1;min-width:260px;}
.compBar .grow b{font-size:15px;}
.compBar .compText{color:var(--muted);margin-top:2px;}
.compBar .compActions{display:flex;gap:8px;flex-wrap:wrap;}
.compBar .compActions .btn{font-size:14px;padding:8px 12px;min-height:38px;}
.compBar .compGuide{width:100%;border-top:1px solid var(--line);padding-top:8px;color:var(--muted);font-size:13px;}
.compBar .compGuide.hidden{display:none;}
.compBar .compGuide code{color:var(--text);word-break:break-all;}
.compBar .compStep{margin:5px 0;}
.compBar .compProgressWrap{height:5px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:7px;max-width:520px;}
.compBar .compProgressWrap.hidden{display:none;}
.compBar .compProgress{height:100%;width:2%;background:var(--accent);transition:width .25s;}
body.light .compBar{background:#fff3e6;border-bottom-color:#f0d6bd;}
body.light .compBar .compProgressWrap{background:#f1e3d5;}

/* 手机/平板横屏：保留左右分栏，压缩侧栏与按钮 */
@media (max-height:480px){
  .side{width:220px;flex-basis:220px;}
  .sideHead{padding:10px 12px 2px;}
  .title{font-size:17px;}
  .hint{font-size:11px;}
  a.btn,button.btn{font-size:13px;padding:7px 10px;}
  .camName{font-size:15px;}
  .camMeta,.camState{font-size:11px;margin-top:3px;}
  .bar{padding:6px 10px;}
  .homeFloat{font-size:14px;padding:9px 13px;bottom:12px;right:10px;}
}
@media (max-width:680px) and (max-height:480px){
  .side{width:200px;flex-basis:200px;}
}
</style></head><body>
<div class="bar">
  <div class="left">
    <div class="title">摄像头</div>
    <div class="hint" id="barHint">正在读取摄像头…</div>
  </div>
  <div class="actions">
    <a class="btn" href="/">返回面板</a>
    <button class="btn" id="themeBtn" onclick="toggleTheme()" title="切换面板风格主题">主题</button>
    <button class="btn" onclick="showComponents()">组件</button>
    <button class="btn" id="refreshBtn" onclick="refreshCams()">刷新</button>
  </div>
</div>
<div class="compBar hidden" id="compBar">
  <div class="grow">
    <b id="compTitle">摄像头组件未就绪</b>
    <div class="compText" id="compText"></div>
    <div class="compProgressWrap hidden" id="compProgressWrap"><div class="compProgress" id="compProgress"></div></div>
  </div>
  <div class="compActions">
    <button class="btn primary" id="compInstall" onclick="installComponents()">安装缺失组件</button>
    <button class="btn" onclick="checkComponents(true)">重新检测</button>
    <button class="btn" onclick="toggleGuide()">手动安装步骤</button>
    <button class="btn" id="compFirewall" onclick="fixFirewall()" style="display:none">修复防火墙</button>
  </div>
  <div class="compGuide hidden" id="compGuide"></div>
</div>
<div class="main">
  <aside class="side">
    <div class="sideHead">
      <div class="sideTitle">摄像头</div>
      <div class="sideSub" id="camCount">—</div>
    </div>
    <div class="camList" id="camList"></div>
  </aside>
  <section class="stage">
    <iframe id="player" title="摄像头画面" allow="autoplay"
      sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-presentation"></iframe>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loadText" id="loadText">正在读取摄像头…</div>
    </div>
    <div class="errBox" id="errBox" hidden>
      <div class="errText" id="errText"></div>
      <div class="errSub" id="errSub"></div>
      <button class="btn primary" onclick="retry()">重试</button>
    </div>
    <div class="hintBar">本机转码 · 约 1–2 秒延迟</div>
  </section>
</div>
<a class="homeFloat" href="/">返回面板</a>
<script>
var HOST = location.hostname || '127.0.0.1';
var PLAY_BASE = '/go2rtc/stream.html?src=';
var initialDid = '';
try { initialDid = new URLSearchParams(location.search).get('did') || ''; } catch (e) {}
var player = document.getElementById('player');
var cams = [], current = null, pollTimer = null, failTimer = null, loadSeq = 0;
var loading = document.getElementById('loading');
var loadText = document.getElementById('loadText');
var errBox = document.getElementById('errBox');
var errText = document.getElementById('errText');
var errSub = document.getElementById('errSub');
var listEl = document.getElementById('camList');
var countEl = document.getElementById('camCount');
var barHint = document.getElementById('barHint');
var refreshBtn = document.getElementById('refreshBtn');
var compBar = document.getElementById('compBar');
var compTitle = document.getElementById('compTitle');
var compText = document.getElementById('compText');
var compInstall = document.getElementById('compInstall');
var compGuide = document.getElementById('compGuide');
var compProgressWrap = document.getElementById('compProgressWrap');
var compProgress = document.getElementById('compProgress');
var compFirewall = document.getElementById('compFirewall');
var compState = null, compTimer = null, compOpen = false;
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function missingText(st){
  var names = {go2rtc:'go2rtc',ffmpeg:'ffmpeg'};
  return (st.missing||[]).map(function(x){return names[x]||x;}).join('、');
}
function applyGo2rtcPage(st){
  PLAY_BASE = '/go2rtc/stream.html?src=';
}
function renderComponents(){
  if(!compState) return;
  var st = compState;
  var j = st.job || {};
  var needs = (st.missing && st.missing.length) || st.update_available;
  if(st.ready && !needs && !j.running && j.state!=='failed' && !compOpen && st.rtsp_ok !== false){
    compBar.classList.add('hidden');
    return;
  }
  compBar.classList.remove('hidden');
  var miss = missingText(st);
  compTitle.textContent = st.ready ? '摄像头组件可更新' : '摄像头组件未就绪';
  var detail = miss ? ('缺少 ' + miss) : '';
  if(st.update_available && !miss) detail = 'go2rtc 可更新以隐藏 ffmpeg 命令行窗口';
  if(st.remote) detail = (detail ? detail + ' · ' : '') + '使用远程 go2rtc';
  if(st.reason) detail += (detail ? ' · ' : '') + st.reason;
  if(j.running || j.state==='failed' || j.state==='done'){
    detail = (j.message || detail);
    if(j.state==='failed') detail += '。可重试，或按下方步骤手动安装。';
    compProgressWrap.classList.remove('hidden');
    compProgress.style.width = Math.max(2, Math.min(100, Number(j.percent||2))) + '%';
  } else {
    compProgressWrap.classList.add('hidden');
  }
  if(st.ready && !needs && !j.running && st.rtsp_ok !== false){
    compTitle.textContent = '摄像头组件运行中';
    detail = 'go2rtc / ffmpeg 正常';
  }
  compText.textContent = detail;
  compInstall.style.display = (st.can_install && (needs || !st.ready || st.rtsp_ok === false) ? '' : 'none');
  compFirewall.style.display = (st.platform === 'windows' ? '' : 'none');
  compInstall.disabled = !!j.running;
  compInstall.textContent = st.admin_authed
    ? ((st.update_available && !(st.missing && st.missing.length)) ? '更新 go2rtc' : ((st.missing && st.missing.length) ? '安装缺失组件' : ((st.go2rtc_ok && st.rtsp_ok === false) ? '重启摄像头组件' : '启动摄像头组件')))
    : '登录后台后安装';
  if(j.state==='failed') compGuide.classList.remove('hidden');
  if(!compGuide.classList.contains('hidden')) renderGuide();
}
function renderGuide(){
  var st = compState || {};
  var items = st.guide || [];
  var html = '<div><b>手动安装步骤</b>（自动安装失败时使用）</div>';
  if(!items.length){
    html += '<div class="compStep">当前平台没有内置下载源，请安装 go2rtc 和 ffmpeg，并确保它们在 PATH 中，或在启动面板时设置 MIOT_GO2RTC。</div>';
  } else {
    items.forEach(function(it, i){
      var how = it.kind==='zip' ? '解压压缩包，取出可执行文件' : it.kind==='gz' ? '用 7-Zip 等工具解压 gz 文件' : '下载后重命名';
      var link = '<a style="color:var(--accent)" href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.name) + ' ' + esc(it.version) + '</a>';
      if(it.mirror) link += '（<a style="color:var(--accent)" href="' + esc(it.mirror) + '" target="_blank" rel="noopener">国内镜像</a>）';
      html += '<div class="compStep">' + (i+1) + '. 下载 ' + link + '，' + how + '，放到 <code>' + esc(it.target) + '</code>。</div>';
    });
    html += '<div class="compStep">' + (items.length+1) + '. 完成后点“重新检测”；仍失败请查看 <code>' + esc((st.paths||{}).log || 'camera-stack/go2rtc.log') + '</code>。</div>';
  }
  if(st.docker){
    html += '<div class="compStep">Docker：请在宿主机安装 go2rtc/ffmpeg，并把容器环境变量 <code>MIOT_GO2RTC</code> 指向宿主机地址。</div>';
  }
  compGuide.innerHTML = html;
}
function showComponents(){
  compOpen = true;
  compBar.classList.remove('hidden');
  if(compState) renderComponents(); else checkComponents(false);
}
function fixFirewall(){
  if(!compState) return;
  fetch('/api/admin/firewall', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
    .then(function(r){return r.json();})
    .then(function(r){
      compText.textContent = r.ok ? '已请求管理员权限，请在 Windows UAC 弹窗中允许；完成后点“刷新”。' : (r.message||r.error||'请求失败');
    })
    .catch(function(e){ compText.textContent = '请求失败：'+e; });
}
function toggleGuide(){
  compGuide.classList.toggle('hidden');
  if(!compGuide.classList.contains('hidden')) renderGuide();
}
function checkComponents(force){
  fetch('/api/camera/setup_state', {cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(st){
      compState = st || {};
      applyGo2rtcPage(compState);
      renderComponents();
      var needs = (compState.missing && compState.missing.length) || compState.update_available;
      if(compState.ready){
        if(!needs && compState.rtsp_ok !== false) compBar.classList.add('hidden');
        if(force || !cams.length) loadCams(force, current && current.did);
      } else {
        setLoading('');
        barHint.textContent = '摄像头组件未就绪';
        showError('摄像头组件未就绪', compState.reason || '请先安装缺失的 go2rtc/ffmpeg 组件。');
      }
    })
    .catch(function(){});
}
function startCompPoll(){
  if(compTimer) return;
  compTimer = setInterval(pollComponents, 1500);
  pollComponents();
}
function pollComponents(){
  fetch('/api/camera/setup_state', {cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(st){
      compState = st || {};
      applyGo2rtcPage(compState);
      renderComponents();
      var j = compState.job || {};
      if(j.running) return;
      if(compTimer){clearInterval(compTimer);compTimer=null;}
      if(j.state==='done' || compState.ready){
        compState.job = {running:false,state:'done',percent:100};
        setTimeout(function(){checkComponents(true);}, 300);
      } else if(j.state==='failed'){
        renderComponents();
        toggleGuide();
      }
    })
    .catch(function(){});
}
function installComponents(){
  if(!compState) return;
  if(!compState.admin_authed){ location.href='/admin'; return; }
  compInstall.disabled = true;
  fetch('/api/camera/setup/install', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
    .then(function(r){return r.json();})
    .then(function(r){
      if(!r.ok){ compText.textContent = r.error || '安装启动失败'; toggleGuide(); compInstall.disabled=false; return; }
      compProgressWrap.classList.remove('hidden');
      startCompPoll();
    })
    .catch(function(){ compInstall.disabled=false; });
}

var THEME_IDS = ['dark','light','apple','flyme','cyber','morandi','pixel'];
var THEME_LABELS = {dark:'经典黑夜',light:'经典白天',apple:'苹果风',flyme:'魅族风',cyber:'赛博霓虹',morandi:'莫兰迪',pixel:'像素终端'};
var theme = 'dark';
var themeBtn = document.getElementById('themeBtn');
function applyTheme(t) {
  if (THEME_IDS.indexOf(t) < 0) t = 'dark';
  theme = t;
  document.body.classList.remove('light','theme-apple','theme-flyme','theme-cyber','theme-morandi','theme-pixel');
  if (t === 'light' || t === 'apple' || t === 'flyme' || t === 'morandi') document.body.classList.add('light');
  if (t !== 'dark' && t !== 'light') document.body.classList.add('theme-' + t);
  document.documentElement.style.colorScheme = document.body.classList.contains('light') ? 'light' : 'dark';
  if (themeBtn) {
    themeBtn.textContent = THEME_LABELS[t] || '主题';
    themeBtn.title = '当前主题：' + (THEME_LABELS[t] || t) + '；点击切换下一个主题';
  }
}
function toggleTheme() {
  var prev = theme, idx = THEME_IDS.indexOf(theme);
  var next = THEME_IDS[(idx + 1) % THEME_IDS.length];
  applyTheme(next);
  fetch('/api/theme', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({theme:next})})
    .then(function (r) { return r.json(); })
    .then(function (r) { if (r && r.ok) applyTheme(r.theme || next); else applyTheme(prev); })
    .catch(function () { applyTheme(prev); });
}
function syncTheme() {
  fetch('/api/status', {cache:'no-store'})
    .then(function (r) { return r.json(); })
    .then(function (s) { if (s && s.theme) applyTheme(s.theme); })
    .catch(function () {});
}
syncTheme();
setInterval(syncTheme, 15000);

function setLoading(text) {
  if (text) { loadText.textContent = text; loading.hidden = false; }
  else { loading.hidden = true; }
}
function showError(text, sub) {
  errText.textContent = text || '画面暂时不可用';
  errSub.textContent = sub || '';
  errBox.hidden = false;
  setLoading('');
}
function hideError() { errBox.hidden = true; }
function stopPlay() {
  clearInterval(pollTimer); clearTimeout(failTimer);
  pollTimer = null; failTimer = null;
  try { player.src = 'about:blank'; } catch (e) {}
}
function ensureStream(cam) {
  return fetch('/api/camera_ensure?src=' + encodeURIComponent(cam.stream), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { return !!(d && d.ok && d.ready); })
    .catch(function () { return false; });
}
function watchStream(cam) {
  clearInterval(pollTimer); clearTimeout(failTimer);
  var started = Date.now(), checking = false, retried = false, alive = false;
  pollTimer = setInterval(function () {
    if (current !== cam || checking || alive) return;
    checking = true;
    fetch('/api/camera_state?name=' + encodeURIComponent(cam.stream), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        checking = false;
        if (current !== cam) return;
        if (data && data.active) {
          alive = true;
          clearInterval(pollTimer); clearTimeout(failTimer);
          pollTimer = null; failTimer = null;
          setLoading('');
          hideError();
          player.style.visibility = 'visible';   // 确认有数据才显示，避免看到 go2rtc 自己糊的 ffmpeg 报错
          barHint.textContent = cam.name + ' · 实时画面';
          return;
        }
        var waited = Date.now() - started;
        if (!retried && waited > 8000) {
          // go2rtc 可能刚重启（流是运行时注册的），再注册一次并重挂播放器
          retried = true;
          ensureStream(cam).then(function (ok) {
            if (!ok || current !== cam || alive) return;
            player.src = PLAY_BASE + encodeURIComponent(cam.stream) + '&mode=mse,hls';
          });
        } else if (waited > 30000) {
          clearInterval(pollTimer); clearTimeout(failTimer);
          pollTimer = null; failTimer = null;
          setLoading('');
          player.style.visibility = 'hidden';
          showError('画面没有出来', '摄像头在线但视频流拉不到：可能被别的设备占用通道，或网络/转码组件异常。点“重试”或右上角“刷新”。');
          barHint.textContent = cam.name + ' · 无画面';
        }
      })
      .catch(function () { checking = false; });
  }, 1500);
}
function playCamera(cam) {
  current = cam;
  renderList();
  hideError();
  stopPlay();
  if (!cam) return;
  if (!cam.stream) {
    showError(cam.error || '该摄像头暂不可播放', cam.online ? '请点右上角“刷新”重新拉流' : '摄像头当前离线');
    barHint.textContent = cam.name + ' · 不可播放';
    return;
  }
  setLoading('正在连接「' + cam.name + '」…');
  barHint.textContent = cam.name + ' · 连接中';
  player.style.visibility = 'hidden';
  ensureStream(cam).then(function (ok) {
    if (current !== cam) return;
    if (!ok) {
      setLoading('');
      showError('摄像头流没有就绪', '已尝试重新注册但没有成功。请确认摄像头在线、与面板在同一网段，或点右上角“刷新”重试。');
      barHint.textContent = cam.name + ' · 流未就绪';
      return;
    }
    player.src = PLAY_BASE + encodeURIComponent(cam.stream) + '&mode=mse,hls';
    watchStream(cam);
  });
}
function renderList() {
  listEl.innerHTML = '';
  cams.forEach(function (cam) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cam' + (cam.online ? ' on' : ' off') + (current && current.did === cam.did ? ' active' : '');
    var dot = document.createElement('span'); dot.className = 'dot';
    var body = document.createElement('div'); body.className = 'camBody';
    var n = document.createElement('div'); n.className = 'camName'; n.textContent = cam.name;
    var m = document.createElement('div'); m.className = 'camMeta';
    var shortIp = cam.ip ? ' · .' + cam.ip.split('.').pop() : '';
    m.textContent = (cam.model || '') + shortIp + (cam.online ? '' : ' · 离线');
    var s = document.createElement('div'); s.className = 'camState';
    s.textContent = cam.note || (cam.stream ? '可查看' : (cam.error || '不可播放'));
    body.appendChild(n); body.appendChild(m); body.appendChild(s);
    b.appendChild(dot); b.appendChild(body);
    b.onclick = function () { selectCam(cam.did); };
    listEl.appendChild(b);
  });
}
function selectCam(did) {
  var cam = cams.filter(function (x) { return x.did === did; })[0];
  if (!cam) return;
  playCamera(cam);
}
function retry() {
  if(compState && !compState.ready){ checkComponents(true); return; }
  var did = current && current.did;
  loadCams(true, did);
}
function refreshCams() {
  if(compState && !compState.ready){ checkComponents(true); return; }
  loadCams(true);
}
function loadCams(force, preferDid) {
  var seq = ++loadSeq;
  refreshBtn.disabled = true;
  setLoading(force ? '正在重新拉取摄像头…' : '正在读取摄像头…');
  hideError();
  stopPlay();
  barHint.textContent = '正在读取摄像头…';
  fetch('/api/cameras' + (force ? '?refresh=1' : ''))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (seq !== loadSeq) return;
      refreshBtn.disabled = false;
      if (!data || !data.ok) {
        setLoading('');
        countEl.textContent = '—';
        barHint.textContent = '摄像头不可用';
        showError('摄像头列表加载失败', (data && data.error) || '请稍后重试');
        return;
      }
      cams = data.cameras || [];
      countEl.textContent = cams.length + ' 路摄像头' + (data.transcode ? '' : ' · 缺少 ffmpeg');
      if (!cams.length) {
        setLoading('');
        barHint.textContent = '没有摄像头';
        showError('没有找到摄像头', '当前小米账号下没有可用的摄像头，或摄像头不在当前家庭。');
        return;
      }
      current = null;
      var first = cams.filter(function (x) { return preferDid && x.did === preferDid; })[0]
        || cams.filter(function (x) { return x.online && x.stream; })[0] || cams[0];
      playCamera(first);
    })
    .catch(function (e) {
      if (seq !== loadSeq) return;
      refreshBtn.disabled = false;
      setLoading('');
      showError('无法读取摄像头列表', String(e).slice(0, 160));
    });
}
checkComponents(false);
</script>
</body></html>
